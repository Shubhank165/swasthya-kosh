id: abdominal_pain
version: 1
label: Abdominal pain (Udara Shula)
clinical_source: "SOCRATES pain history structure; pending AIIA mentor review"
matches_concepts: [abdominal_pain, stomach_ache, udara_shula]
review_of_systems: [gi, hepatobiliary]
fields:
  - concept: onset
    required: true
    priority: 10
    answer: {type: single_choice, options: [sudden, gradual, unknown]}
    prompts:
      en: "Did the pain start suddenly or gradually?"
      hi: "दर्द अचानक शुरू हुआ था या धीरे-धीरे?"

  - concept: duration
    required: true
    priority: 20
    answer: {type: duration}
    prompts:
      en: "How long has the pain been there?"
      hi: "दर्द कब से है?"

  - concept: site
    required: true
    priority: 30
    answer:
      type: single_choice
      options: [upper, lower, around_navel, whole_abdomen, right_side, left_side, unknown]
    prompts:
      en: "Where in the abdomen is the pain?"
      hi: "पेट में दर्द किस जगह है?"

  - concept: radiation
    required: false
    priority: 40
    precondition: {concept: site, in: [upper, right_side]}
    answer:
      type: single_choice
      options: [to_back, to_right_shoulder, to_groin, none, unknown]
    prompts:
      en: "Does the pain travel anywhere else?"
      hi: "क्या दर्द कहीं और भी जाता है?"

  - concept: severity
    required: true
    priority: 50
    answer: {type: scale, min: 0, max: 10}
    prompts:
      en: "On a scale of nought to ten, how bad is the pain at its worst?"
      hi: "शून्य से दस के बीच, सबसे ज़्यादा होने पर दर्द कितना रहता है?"

  - concept: character
    required: false
    priority: 60
    answer:
      type: single_choice
      options: [cramping, burning, dull_ache, stabbing, colicky, unknown]
    prompts:
      en: "What does the pain feel like?"
      hi: "दर्द कैसा महसूस होता है?"

  - concept: relation_to_meals
    required: true
    priority: 70
    answer:
      type: single_choice
      options: [worse_after_eating, better_after_eating, worse_when_empty, no_relation, unknown]
    prompts:
      en: "Does eating make the pain better or worse?"
      hi: "खाना खाने से दर्द बढ़ता है या कम होता है?"

  - concept: associated_vomiting
    required: true
    priority: 80
    answer: {type: yes_no_unknown}
    prompts:
      en: "Have you vomited since the pain started?"
      hi: "दर्द शुरू होने के बाद क्या उल्टी हुई है?"

  - concept: loose_stools
    required: true
    priority: 90
    answer: {type: yes_no_unknown}
    prompts:
      en: "Have your motions been loose?"
      hi: "क्या पाखाना पतला हो रहा है?"

  - concept: constipation
    required: false
    priority: 100
    answer: {type: yes_no_unknown}
    prompts:
      en: "Have you been constipated?"
      hi: "क्या कब्ज़ रहती है?"

  - concept: burning_micturition
    required: false
    priority: 110
    precondition: {concept: site, in: [lower, right_side, left_side]}
    answer: {type: yes_no_unknown}
    prompts:
      en: "Is there burning when you pass urine?"
      hi: "क्या पेशाब करते समय जलन होती है?"

  - concept: aggravating_factors
    required: false
    priority: 120
    answer: {type: free_text}
    prompts:
      en: "Is there anything that makes the pain worse?"
      hi: "क्या कोई चीज़ दर्द को बढ़ाती है?"

  - concept: relieving_factors
    required: false
    priority: 130
    answer: {type: free_text}
    prompts:
      en: "Is there anything that gives you relief?"
      hi: "क्या किसी चीज़ से आराम मिलता है?"

  - concept: treatment_taken
    required: true
    priority: 140
    answer: {type: free_text}
    prompts:
      en: "Have you taken anything for this pain so far?"
      hi: "इस दर्द के लिए अब तक आपने कुछ लिया है?"

  - concept: prior_episodes
    required: false
    priority: 150
    answer: {type: yes_no_unknown}
    prompts:
      en: "Have you had this same pain before?"
      hi: "क्या पहले भी ऐसा ही दर्द हुआ है?"
