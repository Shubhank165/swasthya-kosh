# Build the one image. Context is the repository root, because the image needs
# both `backend/` and `clinical/` — the clinical content ships inside the image
# so a deployed build and the pathways it runs cannot drift apart.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/Dockerfile
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      # The previous `latest` warms the layer cache; on the very first build
      # there is nothing to pull, which is why this step is allowed to fail.
      - --cache-from=${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
options:
  logging: CLOUD_LOGGING_ONLY
  # The default machine, not E2_HIGHCPU_8. A newly created project has no quota
  # for the larger Cloud Build machines in asia-south1 and the build fails with
  # FAILED_PRECONDITION rather than queueing — and raising that quota needs a
  # support request, which is not a thing a deploy script can wait on. The image
  # is a Python service; it builds in a few minutes on the default.
  machineType: E2_MEDIUM
timeout: 1200s
