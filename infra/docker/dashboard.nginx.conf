# Serving the dashboard beside the API.
#
# Three jobs, and the third is the one that is easy to get wrong.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 1. A single-page app: every path that is not a file is the app, which
    #    resolves it with the router. Without this, reloading /alerts is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. The API, same-origin. The dashboard never learns about a second origin,
    #    so there is no CORS configuration to get wrong and the refresh cookie
    #    stays first-party.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A report is regenerated on every read and a document upload is a
        # multipart POST of a photograph. Neither is fast on a laptop running
        # the whole stack.
        proxy_read_timeout 120s;
    }

    # 3. The worklist socket. `Upgrade` and `Connection` have to be forwarded
    #    explicitly — without them nginx answers the handshake with a 200, the
    #    dashboard's socket closes immediately, and it reconnects for ever
    #    behind a list that has quietly stopped updating. That is precisely the
    #    failure §7 exists to make visible, so it must not be introduced here.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Longer than the backend's heartbeat, or nginx closes a healthy idle
        # socket and the dashboard spends the demo reconnecting.
        proxy_read_timeout 3600s;
    }

    # No clinical content is ever a static asset, so caching the bundle
    # aggressively is safe; the HTML is not, because a stale index.html pins
    # the dashboard to a build that no longer matches the API.
    location ~* \.(js|css|woff2?|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
