# Medicine name -> ingredient key.
#
# Prescriptions are written by hand, in brand names, with dosage forms attached:
# "Tab. Glycomet 500 BD". The interaction table is keyed on ingredients, so
# something has to bridge the two, and that something is this file rather than a
# fuzzy matcher — an interaction flag raised on a spelling guess is worse than
# no flag.
#
# Matching is exact after folding (case, punctuation, diacritics). A name that
# is not listed here resolves to nothing and contributes to no interaction
# finding. That is the intended failure mode: a miss is safe, a false match is
# not.
#
# STATUS: engineer-authored. The brand list is the common Indian OPD subset and
# is nowhere near exhaustive. Pending review by the AIIA clinical mentor.

