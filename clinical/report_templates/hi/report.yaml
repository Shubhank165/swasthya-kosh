  history_unfiltered: >-
    इस अस्पताल के सभी तिथि-सहित अभिलेख, नवीनतम पहले। आज की शिकायत से
    प्रासंगिकता के आधार पर कोई चयन नहीं किया गया है।
  history_filtered_note: >-
    आज की शिकायत से संबंधित मानकर चुने गए। {omitted} पूर्व प्रविष्टि(याँ)
    असंबंधित मानी गईं और यहाँ नहीं दिखाई गईं; पूरा अभिलेख उपलब्ध है।
  history_source_visit: "परामर्श"
  history_source_document: "दस्तावेज़"
  timeline_dated: "{document} की तिथि {date} है — इस इंटेक से {days} दिन पहले। इससे पढ़ी गई कोई भी बात उस तिथि पर रोगी की स्थिति दर्शाती है, आवश्यक नहीं कि आज की; वर्तमान स्थिति रोगी से पुष्टि करें।"
  timeline_future: "{document} की तिथि {date} है, जो इस इंटेक के {days} दिन बाद है। दस्तावेज़ की तिथि जाँचें — दोनों में से एक ग़लत है।"
  timeline_undated: "{document} पर कोई पठनीय तिथि नहीं है। इसे समयरेखा पर नहीं रखा जा सकता; जब तक रोगी पुष्टि न करे, इससे पढ़ा गया हर मान पुराना मानें।"
