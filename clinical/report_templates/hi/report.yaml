# Field labels in Hindi.
#
# Deliberately partial. It covers the fields the Jetson's extractor currently
# produces; anything else falls back to the English display from the concept
# registry, which a Hindi-speaking clinician can still read. The alternative —
# machine-translating a clinical term nobody reviewed — is how "not applicable"
# becomes "absent" on a document somebody acts on.
#
# STATUS: engineer-authored. Pending review by a Hindi-speaking clinician at
# AIIA. Recorded in docs/DECISIONS.md.
