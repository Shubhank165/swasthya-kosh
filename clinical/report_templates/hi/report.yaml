# हिन्दी report wording.
#
# Written as Hindi, not translated from the English file at runtime. The two
# files are reviewed separately and are allowed to differ in phrasing where
# clinical Hindi differs from clinical English.
#
# `not_established` is the line that matters most. It must read as "यह जानकारी
# प्राप्त नहीं हुई" — the information was not obtained — and must never read as
# "नहीं" or "अनुपस्थित", which would turn an unasked question into a denial in a
# document a physician acts on.
#
# STATUS: engineer-authored Hindi. Pending review by a Hindi-speaking clinician
# at AIIA before any deployment carrying real patients. Recorded in
# docs/DECISIONS.md.

