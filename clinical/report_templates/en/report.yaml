# English report wording.
#
# Written, not translated. Every string here is read by a physician who is about
# to see the patient, so each one says exactly what is known and exactly how
# firmly — and nothing more. No string in this file may state a diagnosis,
# suggest an interpretation or give advice; `app/domain/report/safety.py` scans
# the rendered output and the test suite fails the build on a hit.
#
# The wording of `not_established` is the most important line in the file. It is
# what an unasked, unresolved or refused field renders as, and it must never
# read as a denial.

strings:
  header_disclaimer: >-
    DRAFT PRE-CONSULTATION INTAKE — patient-reported, not verified by a
    clinician. This document contains no diagnosis and no clinical advice.

  footer_disclaimer: >-
    Generated by MediKiosk from patient-reported answers and uploaded documents.
    Every line requires physician verification before use.

  unresolved_title: "Unresolved"
  timeline_title: "Document timeline"
  conflicts_title: "Information conflicts"
  safety_title: "Safety"
  interactions_title: "Medicine review"

  nothing_recorded: "Nothing recorded."
  nothing_outstanding: "Nothing outstanding."
  no_conflicts: "No conflicts detected between today's answers and prior records."
  timeline_none: "No documents to place in time."
  timeline_dated: "{document} is dated {date} — {days} day(s) before this intake. Anything read from it describes the patient on that date, not necessarily today; confirm current status with the patient."
  timeline_future: "{document} is dated {date}, which is {days} day(s) after this intake. Check the date on the document — one of the two is wrong."
  timeline_undated: "{document} carries no legible date. It cannot be placed on the timeline; treat every value read from it as historical until the patient confirms it still holds."
  no_alerts: "No urgent clinical review criteria were triggered on the device."
  no_interactions: "No sourced interaction found among the medicines listed."

  # An unasked, unresolved or refused field. Never "absent", never "no".
  not_established: "{field} — not established"
  declined_to_answer: "{field} — patient declined to answer"
  not_applicable: "{field} — not applicable"

  denies: "Denies {field}"
  patient_said: "patient said: \"{text}\""

  repaired_marker: "restructured from malformed input — verify"
  verify_marker: "low-confidence reading — verify against the original"
  approximate_marker: "approximate"
  uncertain_marker: "uncertain"
  unverified_marker: "unverified"
  attendant_marker: "reported by attendant"

  conflict_today: "Patient today"
  conflict_record: "Prior record"
  conflict_not_mentioned: "not mentioned"
  conflict_resolution: "Physician verification required"

  alert_awaiting: "awaiting acknowledgement"
  alert_acknowledged: "acknowledged by {actor}"

  document_unprocessed: "{document} uploaded, not yet processed"
  document_low_confidence: "{document} read with low confidence — verify against the original"
  document_rejected: "{document} could not be read ({reason}) — a fresh photograph is needed"
  document_other_text: "{document}: \"{text}\" — read off the page but not placed in any clinical section; check the scan"

  interaction_prompt: "These two may interact — please review."

  range_below: "below the reference range printed on this report"
  range_above: "above the reference range printed on this report"
  range_unavailable: "no reference range printed on this report — not compared"

  demo_banner: "DEMONSTRATION MODE — this report was generated from fixture data."

sections:
  identity: "Patient"
  chief_complaint: "Chief complaint"
  hpi: "History of presenting illness"
  past_medical: "Past medical history"
  past_surgical: "Past surgical history"
  medications: "Drug history"
  allergies: "Allergies"
  family_history: "Family history"
  personal_history: "Personal history"
  review_of_systems: "Review of systems"
  investigations: "Prior investigations"
  ayurveda: "Ayurveda — patient-reported"
  red_flag_screen: "Screening responses"
  consent: "Consent"
