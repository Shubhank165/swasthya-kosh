# NAMASTE seed — National AYUSH Morbidity and Standardised Terminologies.
#
# A CURATED SEED, not a release. The loader in app/services/terminology.py can
# ingest a full NAMASTE release into the same tables; this file exists so the
# system runs end-to-end offline in CI and at a demo without shipping licensed
# content into the repository.
system: NAMASTE
version: "seed-0.1"
uri: "http://terminology.medikiosk.local/CodeSystem/namaste"
source_note: >
  Codes here are placeholders shaped like NAMASTE codes for development. They
  MUST be replaced with the real release before any clinical use, and no code in
  this file should be treated as authoritative.
needs_clinical_review: true
concepts:
  - code: AY-JWR
    display: Jwara
    definition: Fever as described in Ayurvedic nosology
    discipline: ayurveda
  - code: AY-UDR-SHL
    display: Udara Shula
    definition: Pain in the abdomen
    discipline: ayurveda
  - code: AY-HRD-SHL
    display: Hrid Shula
    definition: Pain in the cardiac region
    discipline: ayurveda
  - code: AY-SHR-SHL
    display: Shirah Shula
    definition: Headache
    discipline: ayurveda
  - code: AY-SND-VAT
    display: Sandhigata Vata
    definition: Vata vitiation localised to the joints
    discipline: ayurveda
  - code: AY-MDH
    display: Madhumeha
    definition: A Prameha subtype characterised by sweet urine
    discipline: ayurveda
  - code: AY-RKT-VAT
    display: Raktagata Vata
    definition: Vata vitiation involving Rakta dhatu
