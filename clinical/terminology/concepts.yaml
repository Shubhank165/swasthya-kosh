# Concept registry.
#
# One entry per clinical concept the intake can record. `section` places the
# concept in the history; `synonyms` are matched exactly after normalisation
# (lowercase, punctuation stripped) and carry the Hindi and transliterated forms
# a patient actually says. `codes` are filled in only where a real mapping
# exists — an absent code is correct, an invented one is a defect.
#
# Fields marked needs_clinical_review were authored by an engineer and are
# listed in docs/CLINICAL_REVIEW_QUEUE.md for the AIIA mentor session.

# --- identity, language, consent ---------------------------------------------
patient_name:
  display: Name
  section: identity
age:
  display: Age
  section: identity
sex:
  display: Sex
  section: identity
