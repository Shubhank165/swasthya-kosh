# The questions specific to one problem area.
#
# These fill the slots in `domain_slots` — the things the shared symptom
# template cannot cover because they only mean something inside one domain.
# "What colour is the sputum" is not a general question with a domain attached;
# it is only a question at all if the patient is coughing.
#
# Every one carries `requires: {slot: <domain>.present, equals: true}`. That is
# §9 and it is not a formality: "how high did your temperature get" asked of
# somebody who never mentioned fever is a question that invents a symptom by
# asking about it, and patients answer questions they are asked.
#
# `<domain>.present` is set by the answer to fixed question 1, so a domain the
# patient did not tick has none of this reachable.
#
# clinical_source: engineer-authored; pending AIIA mentor review.

version: 1

questions:
  # --- fever -------------------------------------------------------------------

  - id: fever.measured
    answer_type: boolean
    extracts: [fever.measured]
    domains: [fever]
    priority: 7
    burden: 1
    requires: {slot: fever.present, equals: true}

  # Both units offered. An Indian household thermometer reads Fahrenheit, and a
  # Celsius-only box does not stop that patient answering — it invites them to
  # type 101 into it, which is a fever recorded as hypothermia. Nothing is
  # converted; the unit travels with the number.
  - id: fever.maximum_temperature
    answer_type: numeric
    extracts: [fever.maximum_temperature]
    domains: [fever]
    priority: 8
    burden: 1
    unit: fahrenheit
    units: [fahrenheit, celsius]
    # Wide enough for both scales, because the range is checked *before* the
    # unit is known. 90-110 is the Fahrenheit range and it rejected every
    # Celsius answer the question invites — a patient who typed 39 was told
    # nothing and their reading was dropped. Discriminating between the two is
    # the unit inference's job (the ranges do not overlap anywhere a person is
    # alive); this is only a sanity bound against a typo.
    minimum: 30
    maximum: 110
    requires:
      all:
        - {slot: fever.present, equals: true}
        - {slot: fever.measured, equals: true}

  - id: fever.chills
    answer_type: boolean
    extracts: [fever.chills]
    domains: [fever]
    priority: 7
    burden: 1
    requires: {slot: fever.present, equals: true}

  - id: fever.fever_pattern
    answer_type: single_select
    extracts: [fever.fever_pattern]
    domains: [fever]
    priority: 7
    burden: 1
    options: [continuous, once_daily, twice_daily, alternate_days, irregular]
    requires: {slot: fever.present, equals: true}

  # --- pain --------------------------------------------------------------------

  - id: pain.site
    answer_type: single_select
    extracts: [pain.site]
    domains: [pain]
    priority: 10
    burden: 1
    options:
      [head, neck, chest, upper_abdomen, lower_abdomen, back, limb, joint, pelvis, other]
    requires: {slot: pain.present, equals: true}

  # Structured text rather than a list of adjectives. "A burning pain on the
  # right side that gets worse after eating" is one sentence carrying character,
  # site and an aggravating factor, and it is what somebody in pain actually
  # types; the interpreter takes all three out of it (§13).
  - id: pain.description
    answer_type: structured_text
    extracts: [pain.character, pain.site, pain.aggravating, pain.radiation]
    domains: [pain]
    priority: 9
    burden: 2
    requires: {slot: pain.present, equals: true}

  - id: pain.character
    answer_type: single_select
    extracts: [pain.character]
    domains: [pain]
    priority: 8
    burden: 1
    options: [burning, cramping, stabbing, dull_ache, throbbing, pressing, shooting, other]
    requires: {slot: pain.present, equals: true}

  - id: pain.radiation
    answer_type: free_text
    extracts: [pain.radiation]
    domains: [pain]
    priority: 8
    burden: 1
    requires: {slot: pain.present, equals: true}

