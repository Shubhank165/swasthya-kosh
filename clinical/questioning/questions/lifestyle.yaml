# Personal and lifestyle history.
#
# Fifteen questions about how the patient lives: what they eat, how they sleep,
# how their bowels and appetite behave, what work and stress fill their day.
# Every one asks about something the patient experiences directly, and every one
# means the same thing with no interpretive framework around it.
#
# These are the questions the kiosk has always actually asked. A separate
# sixty-two question constitutional module existed in the backend's content tree
# - forehead width in angula, eyelash texture, hair curl, and a psychometric
# battery on temperament and recall - but no device ever served it, and the two
# trees had drifted so far apart that the generator agreed with neither. It was
# removed rather than reconciled: it is only interpretable inside the framework
# it came from, and that framework is no longer what this system is for.
#
# clinical_source: engineer-authored, structured from standard OPD case-taking
# order; pending clinical review.

# `current_state: true` marks the three re-asked on a return visit: appetite,
# bowel habit and sleep. What a patient reports about those moves between two
# visits a fortnight apart, and today's answer is the one that matters. The
# rest of the set does not move, and asking again would waste the visit.

version: 1
questions:
- id: lifestyle.appetite
  answer_type: single_select
  extracts:
  - lifestyle.appetite
  priority: 8
  burden: 1
  options:
  - poor
  - variable
  - normal
  - excessive
  current_state: true
