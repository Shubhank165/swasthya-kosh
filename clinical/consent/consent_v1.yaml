# Consent artefacts.
#
# The DPDP Act 2023 requires that we can produce, for any patient, exactly what
# they agreed to, in which language, when, and who granted it. That means the
# consent text is versioned content — not a string in a template — and the
# artefact stored against an intake references this version immutably.
#
# Purpose codes are granted separately. `raw_audio_retention` (kiosk) and
# `on_device_voice_input` (app) are NOT part of the base grant: speaking an
# answer, keeping the recording of it, and — for the app — processing the voice
# on-device with nothing kept are three different asks.
version: 1
effective_from: "2026-01-01"
clinical_source: "drafted against DPDP Act 2023 notice requirements; pending institutional legal review"

purposes:
  - code: history_intake
    required: true
    label:
      en: "Recording your health history for today's consultation"
      hi: "आज के परामर्श के लिए आपकी स्वास्थ्य जानकारी दर्ज करना"
    description:
      en: >
        We will record the answers you give and any papers you scan, so the
        doctor has your history ready before you go in.
      hi: >
        आप जो उत्तर देंगे और जो कागज़ स्कैन करेंगे, हम उन्हें दर्ज करेंगे, ताकि
        आपके अंदर जाने से पहले डॉक्टर के पास आपकी जानकारी तैयार हो।

  - code: document_processing
    required: false
    label:
      en: "Reading your previous prescriptions and reports"
      hi: "आपके पिछले पर्चे और रिपोर्ट पढ़ना"
    description:
      en: >
        We will read the papers you scan to pull out your past conditions and
        medicines. The doctor checks everything we read before it is used.
      hi: >
        आप जो कागज़ स्कैन करेंगे, हम उनसे आपकी पुरानी बीमारियाँ और दवाइयाँ
        निकालेंगे। हमने जो पढ़ा है, डॉक्टर उसे इस्तेमाल से पहले जाँचेंगे।

  - code: raw_audio_retention
    required: false
    default_granted: false
    # Kiosk only. The patient app has no microphone and never will (2/3 §1
    # rule 1), so offering this purpose there would ask a patient to consent to
    # the retention of audio the app is incapable of capturing — a consent
    # record that describes something that did not happen is worse than no
    # record, and this one would be produced for every app intake.
    applies_to: [kiosk]
    label:
      en: "Keeping a recording of your voice"
      hi: "आपकी आवाज़ की रिकॉर्डिंग रखना"
    description:
      en: >
        You can answer by speaking without us keeping the recording. If you agree
        to this separately, we keep the audio so the doctor can listen back to
        exactly what you said. You can say no and still use the kiosk normally.
      hi: >
        आप बोलकर उत्तर दे सकते हैं और हम रिकॉर्डिंग नहीं रखेंगे। अगर आप अलग से
        सहमति दें, तो हम आवाज़ रखेंगे ताकि डॉक्टर आपकी बात दोबारा सुन सकें। आप
        मना कर सकते हैं और फिर भी कियोस्क सामान्य रूप से उपयोग कर सकते हैं।

  - code: on_device_voice_input
    required: false
    default_granted: false
    # App only, and distinct from `raw_audio_retention` above. The kiosk keeps a
    # recording so a physician can listen back; the phone app does not keep
    # anything. The microphone feeds a recogniser that runs on the phone, the
    # audio is held in memory for the few seconds someone is speaking, and it is
    # never written to storage or sent anywhere — see the DECISIONS entry that
    # reversed the touch-only stance. Consent is still asked because processing
    # a person's voice is processing their data even when nothing is retained.
    #
    # clinical_source: engineer-drafted for the on-device voice feature; the
    # wording and the version bump (this belongs in a consent_v2) are on the
    # review queue for institutional legal review.
    applies_to: [app]
    label:
      en: "Answering by voice on this phone"
      hi: "इस फ़ोन पर आवाज़ से उत्तर देना"
    description:
      en: >
        You can speak your answers instead of tapping. Your voice is understood
        on this phone only — nothing is recorded, saved, or sent anywhere. You
        can say no and answer by touch as usual.
      hi: >
        आप टैप करने के बजाय बोलकर उत्तर दे सकते हैं। आपकी आवाज़ केवल इसी फ़ोन पर
        समझी जाती है — कुछ भी रिकॉर्ड, सहेजा या कहीं भेजा नहीं जाता। आप मना कर
        सकते हैं और हमेशा की तरह छूकर उत्तर दे सकते हैं।

  - code: hospital_record_linkage
    required: false
    label:
      en: "Linking this history to your hospital record"
      hi: "इस जानकारी को आपके अस्पताल रिकॉर्ड से जोड़ना"
    description:
      en: >
        We will attach today's history to your file at this hospital so it is
        there at your next visit.
      hi: >
        आज की जानकारी हम इस अस्पताल में आपकी फ़ाइल से जोड़ देंगे ताकि अगली बार
        भी उपलब्ध रहे।

notice:
  en: >
    This kiosk records your health history so the doctor has it ready. It does
    not diagnose you and it does not give medical advice. A doctor reviews
    everything before it is used. You may stop at any time, skip any question,
    or ask a member of staff to help you instead. Refusing does not affect your
    place in the queue or your treatment.
  hi: >
    यह कियोस्क आपकी स्वास्थ्य जानकारी दर्ज करता है ताकि डॉक्टर के पास पहले से
    उपलब्ध हो। यह कोई रोग नहीं बताता और न ही कोई चिकित्सकीय सलाह देता है। उपयोग
    से पहले डॉक्टर सब कुछ जाँचते हैं। आप कभी भी रोक सकते हैं, कोई भी प्रश्न छोड़
    सकते हैं, या किसी कर्मचारी से मदद माँग सकते हैं। मना करने से आपकी क़तार में
    जगह या इलाज पर कोई असर नहीं पड़ेगा।

withdrawal:
  en: >
    You can ask us to delete what we recorded, at the registration desk, at any
    time before or after your consultation.
  hi: >
    आप कभी भी — परामर्श से पहले या बाद में — पंजीकरण डेस्क पर कहकर दर्ज की गई
    जानकारी हटवा सकते हैं।

granting_parties: [self, parent_guardian, family_attendant, caregiver]
