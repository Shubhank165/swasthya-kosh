plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "in.medikiosk.app"
    // 36 rather than Flutter's default: `sqlite3_flutter_libs` requires 35+,
    // and that is the package providing the SQLite the encrypted local database
    // runs on (2/3 §10). compileSdk only affects what the app compiles against;
    // `minSdk` is what decides which phones can install it.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    // 17, matching the JDK the build is pinned to. AGP 8 warns on 1.8, and
    // several of this app's plugins are compiled against 17.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "in.medikiosk.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // 24, not Flutter's default. `flutter_tts` requires it, and that is
        // the dependency that reads the consent notice aloud (2/3 §11) — the
        // one place audio is warranted in a touch-only app. API 24 is Android
        // 7.0 (2016); the alternative is dropping consent read-aloud, which is
        // an accessibility regression for exactly the patients who need it.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
