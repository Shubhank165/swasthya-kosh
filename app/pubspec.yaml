name: medikiosk_app
description: >
  MediKiosk patient app — touch-only pre-consultation intake for AYUSH hospital
  OPDs. Walks the same question content the kiosk's Jetson walks and produces
  the same versioned record.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # `any`, because nothing in `lib/` imports package:intl — it is here only
  # so `flutter gen-l10n` sees it declared, and `flutter_localizations` pins
  # the exact version anyway (0.19.0 on Flutter 3.22, 0.20.x on 3.35+).
  # Pinning 0.20.3 here made the app unbuildable on any Flutter older than
  # 3.35: that version needs Dart ^3.9, and version solving fails outright.
  intl: any

  # State. Riverpod, per 2/3 §13.
  flutter_riverpod: ^2.5.1

  # Networking, with an auth interceptor and retry.
  dio: ^5.4.3+1

  # Local database, encrypted at rest (§10). Drift over SQLCipher.
  drift: ^2.18.0
  # SQLCipher only, and deliberately **not** `sqlite3_flutter_libs` beside it.
  # Both packages register the same `Sqlite3FlutterLibsPlugin` class, so having
  # both fails the dex merge with "type is defined multiple times" — and if it
  # ever linked, the app would carry two SQLite builds and the first connection
  # would decide which one a patient's health answers are written with. This
  # package ships the encrypted build, which is the one §10 requires.
  sqlcipher_flutter_libs: ^0.6.1
  # Imported directly by storage/database.dart to point sqlite3 at the
  # SQLCipher build before the first connection opens.
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # The encryption key lives in Keychain / Keystore, never in the database and
  # never in shared preferences (§7.1, §10).
  flutter_secure_storage: ^9.2.2

  # Document capture and preparation (§8). `image` does the downscale and the
  # EXIF strip; `camera` is deliberately absent — image_picker hands off to the
  # OS camera app, so this app never holds a camera permission of its own.
  image_picker: ^1.1.2
  image: ^4.2.0

  # Question and consent text read aloud (§11, §14). Output only.
  flutter_tts: ^4.0.2

  # On-device voice input — 2/3 §16, and the DECISIONS entry that reversed the
  # touch-only stance. Every piece here runs on the phone:
  #   record       captures 16 kHz PCM from the mic and nothing else — no file,
  #                no upload. It exposes its own permission check, so
  #                permission_handler stays out (still forbidden below).
  #   sherpa_onnx  the offline recogniser. Bundles its own native libs; the ASR
  #                model ships in the APK (assets/asr/) and is copied to app
  #                storage on first launch — there is no download.
  # `on_device_voice_test.dart` asserts there is no cloud speech package beside
  # these and that nothing in lib/voice/ touches the network at all.
  record: ^6.0.0
  sherpa_onnx: ^1.13.7

  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/bundle/
    # Decorative only. Nothing here is read, measured or shown to a
    # clinician; a missing file costs a picture and nothing else.
    - assets/illustrations/
    # The offline ASR models — shipped in the APK so voice input works on
    # first launch with no download, and never fetched. ~103 MB of
    # Whisper-tiny int8 for English, ~140 MB of IndicConformer int8 for Hindi;
    # neither transcribes the other's language usably. See
    # lib/voice/asr_models.dart for the measurements behind that split, and
    # tool/asr/build_indicconformer.py for how the Hindi one is produced.
    - assets/asr/whisper-tiny/
    - assets/asr/indic-hi/
